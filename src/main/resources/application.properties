spring.application.name=tiendaOnline

# ─── Base de datos ────────────────────────────────────────────────────────────
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USER}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Correo electrónico ───────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

# ─── Subida de archivos ───────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:/opt/tienda-online/uploads}

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
jwt.issuer=${JWT_ISSUER:tienda-online-api}
jwt.audience=${JWT_AUDIENCE:tienda-online-client}
# Máximo permitido: 900000 ms (15 minutos)
jwt.expiration=${JWT_EXPIRATION_MS:900000}

# ─── Imagen de perfil por defecto ─────────────────────────────────────────────
imagen.perfil.por.defecto=/images/sinImagenPerfil.webp

# ─── Servidor ─────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://tienda-online-frontend-nine.vercel.app}

# ─── Caché (Caffeine) ─────────────────────────────────────────────────────────
cache.productos.ttl-minutes=10
cache.productos.max-size=100

cache.busqueda-productos.ttl-minutes=5
cache.busqueda-productos.max-size=200

cache.producto-por-id.ttl-minutes=10
cache.producto-por-id.max-size=500

# ─── Idempotencia ─────────────────────────────────────────────────────────────
idempotency.ttl-hours=24
idempotency.max-size=10000

# ─── Rate Limiting ────────────────────────────────────────────────────────────
rate-limit.auth.requests=10
rate-limit.auth.duration-minutes=1
rate-limit.productos.requests=100
rate-limit.productos.duration-minutes=1
rate-limit.compras.requests=30
rate-limit.compras.duration-minutes=1
rate-limit.usuarios.requests=20
rate-limit.usuarios.duration-minutes=1

# ─── Wompi ────────────────────────────────────────────────────────────────────
# Valores por defecto para desarrollo local (sandbox). En producción usar variables de entorno.
wompi.public-key=${WOMPI_PUBLIC_KEY}
wompi.private-key=${WOMPI_PRIVATE_KEY}
wompi.events-key=${WOMPI_EVENTS_KEY}
wompi.integrity-key=${WOMPI_INTEGRITY_KEY}
wompi.base-url=${WOMPI_BASE_URL}
wompi.connect-timeout-seconds=5
wompi.read-timeout-seconds=15

# ─── Logging ──────────────────────────────────────────────────────────────────
# Nivel por defecto: WARN. En desarrollo usar profile 'dev' para DEBUG/TRACE.
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.fesc.tiendaOnline=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}

# ─── HikariCP (Pool de conexiones) ───────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── Compresión HTTP ──────────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true